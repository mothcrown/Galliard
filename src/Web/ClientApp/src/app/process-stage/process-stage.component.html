<div class="process-stage" [class.text-warning]="stage.loading" [class.text-success]="stage.success && !stage.loading"
     [class.text-danger]="!stage.success && !stage.loading">
  <h2>> {{stage.message}}</h2>
  <div *ngIf="stage.loading;else finished">
    <div class="spinner-border" role="status"></div>
  </div>
</div>

<ng-template #finished>
  <i style="font-size: 1.5em" [class.bi-check-lg]="stage.success" [class.bi-x-circle]="!stage.success"></i>
</ng-template>
